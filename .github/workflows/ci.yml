name: CI

on:
  push:
    branches: ["main", "feat/*"]
  pull_request:
    branches: ["main", "feat/*"]

permissions:
  contents: read

jobs:
  test:
    name: Quality Gates & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.2.2
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Setup Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass-dev

      - name: Install Dependencies
        run: |
          uv sync --frozen
          uv pip install -e ".[dev]"

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Code Formatting (Ruff Format)
        run: uv run ruff format --check .

      - name: Run Linter (Ruff Check)
        run: uv run ruff check .

      - name: Type Checking (Mypy Strict)
        run: uv run mypy --strict

      - name: Architecture Layer Enforcement (Import Linter)
        run: uv run lint-imports

      - name: Security Vulnerability Scan (Pip Audit)
        run: uv run pip-audit

      - name: Run Test Suite with Coverage
        run: |
          uv run pytest --cov=smartmech.domain --cov=smartmech.application --cov-report=term-missing --cov-report=xml
