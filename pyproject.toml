[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartmech"
version = "0.1.0"
description = "Autonomous hyper-realistic construction-timelapse YouTube Shorts pipeline"
readme = "README.md"
requires-python = ">=3.11, <3.12"
license = {text = "MIT"}
authors = [
    {name = "Jimrit", email = "jimritdas26@gmail.com"}
]
dependencies = [
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "typer==0.27.3",
    "structlog==26.1.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "aiolimiter==1.3.0",
    "tenacity==9.2.1",
    "dbos==3.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.1",
    "mypy==2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov>=7.1.0",
    "hypothesis==6.170.2",
    "syrupy==6.1.1",
    "pytest-recording==0.14.0",
    "import-linter==2.15",
    "pip-audit==2.10.1",
]

[project.scripts]
smartmech = "smartmech.interface.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/smartmech"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "ASYNC",
    "B",
    "C4",
    "UP",
    "ARG",
    "PTH",
    "TCH",
    "PL",
    "TRY",
    "RUF"
]
ignore = [
    "ARG001", # Unused function argument
    "ARG002", # Unused method argument (protocol implementations)
    "ARG004", # Unused static method argument
    "PTH123", # open() instead of Path.open()
    "E501",    # Line too long (handled by ruff format)
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments in function definition
    "PLR0915", # Too many statements
    "PLR0917", # Too many positional arguments
    "PLR2004", # Magic value used in comparison
    "PLW1510", # Subprocess without check
    "TRY003",  # Avoid specifying long messages outside the exception class
    "TRY300",  # Consider moving to else block
    "EM101",   # Exception must not use a string literal
    "EM102",   # Exception must not use an f-string literal
    "TRY301",  # Abstract `raise` to an inner function
    "UP022",   # capture_output vs stdout/stderr PIPE
    "PLC0415", # import at top level
    "TC002",   # type-checking block
]

[tool.ruff.lint.isort]
known-first-party = ["smartmech"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["smartmech"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "dbos.*",
    "syrupy.*",
    "vcr.*",
    "importlinter.*",
    "pip_audit.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["src/smartmech/domain", "src/smartmech/application"]

[tool.coverage.report]
fail_under = 90
show_missing = true
