repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy strict
        entry: uv run mypy --strict
        language: system
        types: [python]
        pass_filenames: false

      - id: import-linter
        name: import-linter contracts
        entry: uv run lint-imports
        language: system
        pass_filenames: false

      - id: pip-audit
        name: pip audit
        entry: uv run pip-audit
        language: system
        pass_filenames: false
